server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Trailing slash on proxy_pass strips the /api prefix: /api/foo -> auth:3000/foo.
  location /api/ {
    proxy_pass http://auth:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular hashes bundle filenames, so they can be cached forever.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or clients keep stale bundle references after a deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
