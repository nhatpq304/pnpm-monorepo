server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Angular hashes bundle filenames, so they can be cached forever.
  location ~* \.(?:js|css|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must never be cached, or clients keep stale bundle references after a deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
