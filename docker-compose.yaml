# Built images; the environment comes from .env.
name: pnpm-monorepo-${APP_ENV:?}

services:
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: runtime
    env_file: .env
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:?}
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - '4200:80'
