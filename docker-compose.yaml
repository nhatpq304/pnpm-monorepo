# Built images. Config is fixed here; .env only supplies secrets and the environment selectors.
name: pnpm-monorepo-${APP_ENV:?}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 10

  keycloak:
    build:
      context: infra/keycloak
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?}
      # Public URL; becomes the issuer in every token.
      KC_HOSTNAME: https://auth.example.com
      # TLS ends at the reverse proxy in front of Keycloak.
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      FRONTEND_URL: https://app.example.com
    healthcheck:
      test: ['CMD', 'bash', '/opt/keycloak/healthcheck.sh']
      interval: 5s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:?}
    ports:
      - '4200:80'

volumes:
  postgres-data:
